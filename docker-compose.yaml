services:
  teatime:
    build: .
    image: tea
    networks:
      - web
    volumes:
      - tea-data:/data
    restart: unless-stopped
volumes:
  tea-data:
networks:
  web:
    name: web
    # Caddy owns this network; without external, "docker compose down" here
    # would try to delete it and take the reverse proxy's other sites with it
    external: true
