services:
  teatime:
    build: .
    image: tea
    networks:
      - web
    volumes:
      - tea-data:/data
    restart: unless-stopped
    # first-run admin (TEATIME_USER, default "admin") for the site and the API;
    # set it in a .env file beside this one (gitignored). Once accounts exist
    # these are ignored and users are managed in the app. Unset on a fresh
    # volume means no login at all.
    environment:
      TEATIME_PASSWORD: ${TEATIME_PASSWORD:-}
      TEATIME_USER: ${TEATIME_USER:-}
volumes:
  tea-data:
networks:
  web:
    name: web
    # Caddy owns this network; without external, "docker compose down" here
    # would try to delete it and take the reverse proxy's other sites with it
    external: true
