services:
  teatime:
    build: .
    image: tea
    networks:
      - web
    volumes:
      - tea-data:/data
    restart: unless-stopped
    # login for the site and the API; set it in a .env file beside this one
    # (gitignored). Unset means no login at all.
    environment:
      TEATIME_PASSWORD: ${TEATIME_PASSWORD:-}
volumes:
  tea-data:
networks:
  web:
    name: web
    # Caddy owns this network; without external, "docker compose down" here
    # would try to delete it and take the reverse proxy's other sites with it
    external: true
