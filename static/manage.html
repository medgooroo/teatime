<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage — teatime</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">teatime</a>
  <span class="title">Manage</span>
  <span class="spacer"></span>
  <a href="/logout"><button>Sign out</button></a>
  <a href="/"><button>Back to recipes</button></a>
</header>
<main class="home">
  <section id="hRecipes" hidden>
    <h2>Hidden recipes</h2>
    <div id="hRecipesList" class="scroll-list"></div>
  </section>
  <section id="hMeals" hidden>
    <h2>Hidden meals</h2>
    <div id="hMealsList" class="scroll-list"></div>
  </section>
  <p id="noneHidden" class="empty" hidden>Nothing is hidden.</p>

  <section id="account" class="panel">
    <h2>Account</h2>
    <p class="backup-note">Signed in as <strong id="meName"></strong><span id="meRole"></span>.</p>
    <form id="pwForm" class="backup-row">
      <input id="pwCurrent" type="password" placeholder="Current password" autocomplete="current-password" required>
      <input id="pwNew" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
      <button class="primary" type="submit">Change password</button>
    </form>
    <p id="pwStatus" class="backup-note"></p>
  </section>

  <section id="users" class="panel" hidden>
    <h2>Users</h2>
    <div id="userList"></div>
    <form id="userForm" class="backup-row">
      <input id="newName" type="text" placeholder="Name" autocapitalize="none" autocomplete="off" required>
      <input id="newPass" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" minlength="8" required>
      <select id="newRole"><option value="user">User</option><option value="admin">Admin</option></select>
      <button class="primary" type="submit">Add user</button>
    </form>
    <p id="userStatus" class="backup-note"></p>
  </section>

  <section id="backup" class="panel" hidden>
    <h2>Backup</h2>
    <div class="backup-row">
      <button id="backupBtn">Download a backup</button>
      <span class="backup-note">Every recipe, saved meal and setting, as one file.</span>
    </div>
    <div class="backup-row">
      <input id="restoreFile" type="file" accept=".gz,.tgz,application/gzip">
      <label class="backup-mode">
        <input type="checkbox" id="restoreReplace">
        Replace everything (delete recipes not in the backup)
      </label>
      <button id="restoreBtn" disabled>Restore</button>
    </div>
    <p id="backupStatus" class="backup-note"></p>
  </section>
</main>
<script src="common.js"></script>
<script src="manage.js"></script>
</body>
</html>
