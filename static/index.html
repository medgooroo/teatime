<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teatime</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">teatime</a>
  <span class="spacer"></span>
  <button id="syncBtn">Check for new recipes</button>
  <a href="editor.html"><button class="primary">New recipe</button></a>
</header>
<main class="home">
  <div class="searchbar">
    <input id="search" type="search" placeholder="Search recipes and meals" autofocus>
    <input id="ingSearch" type="search" placeholder="Ingredients, comma separated — chicken, lemon, thyme">
  </div>
  <section id="syncPanel" hidden></section>
  <section id="starred" hidden>
    <h2>This week</h2>
    <div id="starredList" class="grid"></div>
  </section>
  <section id="meal" hidden>
    <h2>Meal</h2>
    <ul id="mealList"></ul>
    <div class="meal-actions">
      <span id="mealTotal"></span>
      <button id="clearMeal">Clear</button>
      <button id="saveMealBtn">Save meal</button>
      <a id="cookMeal"><button class="primary">Cook meal</button></a>
    </div>
  </section>
  <section id="mealsSaved" hidden>
    <h2>Saved meals</h2>
    <div id="mealsList" class="grid"></div>
  </section>
  <h2 id="recipesHeading">Recipes</h2>
  <div id="results" class="grid"></div>
  <div id="sentinel"></div>
  <p id="moreNote" class="empty" hidden>Loading more…</p>

  <section id="hiddenSec">
    <h2>Hidden</h2>
    <div class="backup-row">
      <button id="hiddenToggle">Show hidden items</button>
      <span class="backup-note">Hidden recipes and meals stay out of the way until you bring them back.</span>
    </div>
    <div id="hiddenList" class="grid" hidden></div>
  </section>

  <section id="backup">
    <h2>Backup</h2>
    <div class="backup-row">
      <button id="backupBtn">Download a backup</button>
      <span class="backup-note">Every recipe, saved meal and setting, as one file.</span>
    </div>
    <div class="backup-row">
      <input id="restoreFile" type="file" accept=".gz,.tgz,application/gzip">
      <label class="backup-mode">
        <input type="checkbox" id="restoreReplace">
        Replace everything (delete recipes not in the backup)
      </label>
      <button id="restoreBtn" disabled>Restore</button>
    </div>
    <p id="backupStatus" class="backup-note"></p>
  </section>
</main>
<div id="detail" hidden>
  <article id="detailCard"></article>
</div>
<script src="common.js"></script>
<script src="index.js"></script>
</body>
</html>
